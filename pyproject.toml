[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "source-norm"
version = "0.1.0"
description = "Comment-stripped source for static-analysis tests, so a forbidden-token check stops matching the comment that explains the token."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yaya" }]
requires-python = ">=3.9"
keywords = ["static-analysis", "testing", "ast", "lint", "source", "tokenize"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Source = "https://github.com/yayamud76/source-norm"

[tool.setuptools.packages.find]
where = ["src"]
