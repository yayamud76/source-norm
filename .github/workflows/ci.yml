name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest was here and is deliberately gone. Across three runs
        # and two repositories, ALL FIFTEEN macOS jobs reported `cancelled`
        # with zero steps ever started -- no runner was allocated to this
        # account, ~25 minutes each time. A matrix entry that never executes
        # reds the badge while proving nothing, which makes it a coverage claim
        # with no alarm on it. windows-latest, by contrast, allocates and runs,
        # and it caught the 3.9/3.10 ValueError alongside ubuntu. Re-add macOS
        # the day a run allocates, and let that run be the evidence.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (warnings are errors)
        env:
          PYTHONPATH: src
        # -W is an INTERPRETER flag, so it precedes -m. Passed after it, it is
        # argv for unittest's own CLI, which rejects it -- "unrecognized
        # arguments: -W", exit 2, before a test runs, and the promotion never
        # takes effect. The promotion is not decoration: its first execution
        # against this suite reported two unclosed file handles in the lints.
        run: python -W error::ResourceWarning -m unittest discover -s tests -t tests -v
